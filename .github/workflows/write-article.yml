# Writes and publishes one new article with Claude.
# Runs 3 times a day, every day: about 6am, 11am and 4pm Pacific (13:17, 18:17, 23:17 UTC).
# Each run publishes one article: the 11am run writes a product roundup, the others write food/safety guides. Run it any time from the Actions tab
# ("Write an article" → Run workflow), optionally with a specific topic.
# Instructions for the writer live in content-plan/WRITER_PROMPT.md and content-plan/WRITING_GUIDE.md.
name: Write an article

on:
  schedule:
    - cron: '17 13,23 * * *'
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 'What to write'
        type: choice
        options: [guide, roundup]
        default: guide
      topic:
        description: 'Optional topic, e.g. "Can dogs eat blueberries?" (leave blank to use the backlog)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: write-article
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code

      - name: Write the article
        timeout-minutes: 35
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          KIND: ${{ github.event.schedule == '17 18 * * *' && 'roundup' || inputs.kind || 'guide' }}
        run: |
          if [ "$KIND" = "roundup" ]; then PROMPT="$(cat content-plan/ROUNDUP_PROMPT.md)"; else PROMPT="$(cat content-plan/WRITER_PROMPT.md)"; fi
          if [ -n "$TOPIC" ]; then PROMPT="$PROMPT

          The site owner requested this topic for today: $TOPIC"; fi
          claude -p "$PROMPT" \
            --model claude-sonnet-5-5 \
            --allowedTools "Bash Read Write Edit Glob Grep WebFetch WebSearch"

      - name: Download photos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/fetch-photos.mjs

      - name: Build, commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/content/articles)" ]; then
            echo "No article was written this run."; exit 0
          fi
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles src/data/products content-plan/old-topics.csv content-plan/roundup-topics.csv
          for p in src/assets/photos content-plan/used-photos.json; do [ -e "$p" ] && git add "$p"; done
          NEW=$(git diff --cached --name-only --diff-filter=A -- src/content/articles | head -1)
          TITLE=$( [ -n "$NEW" ] && sed -n "s/^title: *['\"]\{0,1\}\(.*\)['\"]\{0,1\} *$/\1/p" "$NEW" | head -1 | sed "s/['\"]$//" )
          git commit -m "Add article: ${TITLE:-backlog update}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          gh workflow run deploy.yml --ref main
          if [ -n "$NEW" ]; then
            URL="https://mypetexperts.com/$(basename "$NEW" .mdx)/"
            ENC=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$URL")
            gh issue comment 1 --repo "${{ github.repository }}" --body "**${TITLE}** is live: $URL

          👉 [Request indexing in Google Search Console](https://search.google.com/search-console/inspect?resource_id=sc-domain%3Amypetexperts.com&id=$ENC) (opens the page inspection; click **Request indexing**, after it finishes deploying in ~2 minutes)" || true
          fi
