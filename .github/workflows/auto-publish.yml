# Publishes articles written by the scheduled Claude routine.
# The routine pushes to a claude/* branch; if the site builds, the branch is merged into main and deployed.
name: Auto-publish Claude articles

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download photos for new articles
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          node scripts/fetch-photos.mjs
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src/content/articles src/assets/photos content-plan/used-photos.json
            git commit -m "Add Pexels photos"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Build must pass before publishing
        run: npm run build
      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout main
          git pull --ff-only origin main
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main
          git push origin --delete "${GITHUB_REF_NAME}"
      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
