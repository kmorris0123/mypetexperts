name: Sleepypod Air
pet: cats
category: Cat carriers
award: Best for flying and car rides
blurb: A soft-sided carrier that shrinks to fit under an airline seat and is also sold as a crash-tested car seat.
bestFor: Air travel and car trips with cats up to 18 pounds
pros:
- Compresses to fit under an airline seat and expands for more room
- Crash-tested and rated to 18 pounds by the Center for Pet Safety
- Top and side entry, with machine-washable bedding
cons:
- Soft sided, which International Cat Care says can collapse and be harder to keep clean
- Always check your airline's rules before you fly
