name: Garmin TT 15 Mini Dog Device
pet: dogs
category: GPS trackers for dogs
award: Best for hunting and off-grid
blurb: A collar tracker that talks to a Garmin handheld by radio, so it doesn't rely on cell coverage.
bestFor: Hunting and field dogs in areas with no cell service
pros:
- Radio range of up to 4 miles to a paired handheld
- Fits necks as small as 9.5 inches
- Water rated to 1 ATM (10 meters)
cons:
- Needs a separate Garmin handheld, such as the Alpha 100 or Astro 320
- Battery is about 16 to 30 hours of typical use
