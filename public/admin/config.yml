# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Admin for mypetexperts.com (Sveltia CMS). Open https://mypetexperts.com/admin/ and choose "Sign In with Token".
# Every save commits to GitHub, and the site rebuilds and goes live in about a minute.

backend:
  name: github
  repo: kmorris0123/mypetexperts
  branch: main

site_url: https://mypetexperts.com
display_url: https://mypetexperts.com
media_folder: public/products
public_folder: /products

output:
  omit_empty_optional_fields: true

editor:
  preview: false

collections:
  - name: articles
    label: Articles
    label_singular: Article
    description: Guides and product roundups. Rules for writing them are in content-plan/WRITING_GUIDE.md.
    folder: src/content/articles
    extension: mdx
    format: yaml-frontmatter
    create: true
    slug: '{{title}}'
    summary: '{{title}} ({{pet}}, {{kind}}){{draft | ternary(" · DRAFT", "")}}'
    sortable_fields: { fields: [pubDate, title], default: { field: pubDate, direction: descending } }
    view_filters:
      - { label: Dogs, field: pet, pattern: dogs }
      - { label: Cats, field: pet, pattern: cats }
      - { label: Product roundups, field: kind, pattern: roundup }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title }
      - { name: description, label: Description, widget: text, hint: 'Shown in Google results and on cards. Max 170 characters.', pattern: ['^[\s\S]{1,170}$', 'Keep it under 170 characters'] }
      - { name: teaser, label: Card teaser, widget: text, required: false, hint: 'Shown on cards around the site. Must NOT give away the answer. Max 170 characters.' }
      - { name: pet, label: Pet, widget: select, options: [dogs, cats] }
      - { name: kind, label: Type, widget: select, options: [{ label: Guide, value: guide }, { label: Product roundup, value: roundup }], default: guide }
      - { name: pubDate, label: Published, widget: datetime, format: YYYY-MM-DD, time_format: false }
      - { name: updatedDate, label: Last updated, widget: datetime, format: YYYY-MM-DD, time_format: false, required: false, hint: 'Set this when you meaningfully revise an article.' }
      - { name: quickAnswer, label: Short answer, required: false, hint: 'For "Can dogs eat X?" guides, e.g. "No." or "Yes, in moderation."' }
      - { name: verdict, label: Short answer color, widget: select, required: false, options: [{ label: 'Green: safe / fine', value: yes }, { label: 'Yellow: be careful / only sometimes', value: caution }, { label: 'Red: not safe', value: no }] }
      - { name: quickNote, label: Handwritten note, required: false, hint: 'Optional 2-5 word aside next to the short answer, e.g. "not even one".' }
      - { name: featured, label: Feature on home page, widget: boolean, default: false, required: false, hint: 'Only one guide should be featured.' }
      - { name: hasAffiliateLinks, label: Has affiliate links, widget: boolean, default: false, required: false }
      - { name: draft, label: Draft (hidden from the live site), widget: boolean, default: false, required: false }
      - name: faq
        label: Common questions (FAQ)
        label_singular: Question
        widget: list
        required: false
        hint: '3-5 short Q&As shown at the end of the article and used by Google and AI answer engines.'
        fields:
          - { name: q, label: Question }
          - { name: a, label: Answer, widget: text }
      - name: sources
        label: Sources
        label_singular: Source
        widget: list
        required: false
        fields:
          - { name: title, label: Title }
          - { name: url, label: URL }
      - name: body
        label: Article
        widget: markdown
        modes: [raw]
        hint: 'Components: <Callout type="danger|info|warn" title="...">...</Callout> and <ProductPick id="product-id">Why we picked it.</ProductPick>'

  - name: products
    label: Products
    label_singular: Product
    description: One file per product. The file name is the id used in articles as <ProductPick id="...">.
    folder: src/data/products
    extension: yaml
    format: yaml
    create: true
    identifier_field: name
    slug: '{{fields.name}}'
    summary: '{{name}} ({{pet}}){{roundup | ternary(" · in " + roundup, "")}}'
    fields:
      - { name: name, label: Product name, hint: 'Exact name as the brand writes it. Used for the Amazon search link.' }
      - { name: pet, label: Pet, widget: select, options: [dogs, cats] }
      - { name: category, label: Category, hint: 'e.g. "Chew toys for dogs"' }
      - { name: award, label: Award, required: false, hint: 'e.g. "Best overall", "Best budget"' }
      - { name: blurb, label: Short description, widget: text }
      - { name: bestFor, label: Best for, required: false }
      - { name: pros, label: Pros, widget: list, required: false }
      - { name: cons, label: Cons, widget: list, required: false }
      - { name: href, label: Exact product link (optional), required: false, hint: 'Leave empty to link to an Amazon search for the product name. Your Amazon tracking ID is added automatically.' }
      - { name: retailer, label: Retailer, default: Amazon, required: false }
      - { name: image, label: Product photo, widget: image, required: false }
      - { name: art, label: Fallback illustration, widget: select, options: [ball, box, brush, bed, bowl, fountain, harness, scratcher, wand], default: ball, required: false }
      - { name: note, label: Handwritten note, required: false }
      - { name: roundup, label: Roundup article slug, required: false, hint: 'e.g. best-cat-litter' }
      - { name: featured, label: Lead product on home page, widget: boolean, default: false, required: false }
